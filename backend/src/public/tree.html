<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <title>User Hierarchy Tree - Org Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #2c3e50;
      font-size: 2.5rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }

    .tree-container {
      width: 100%;
      overflow-x: auto;
      padding: 20px;
      min-height: 600px;
    }

    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Root level */
    .level-0 {
      margin-bottom: 80px;
    }

    /* Each row of nodes */
    .tree-level {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-bottom: 80px;
      position: relative;
      flex-wrap: wrap;
    }

    /* Node styling */
    .node {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .node-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      min-width: 250px;
      max-width: 280px;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .node-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    .node-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: #3498db;
    }

    /* Role-specific colors for left border */
    .node-card.level-1::before { background: #6f42c1; }
    .node-card.level-2::before { background: #007bff; }
    .node-card.level-3::before { background: #28a745; }
    .node-card.level-4::before { background: #fd7e14; }

    .node-name {
      font-weight: 700;
      color: #2c3e50;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .node-email {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .node-role {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Role background colors */
    .level-1 { background: linear-gradient(135deg, #6f42c1, #8e44ad); }
    .level-2 { background: linear-gradient(135deg, #007bff, #3498db); }
    .level-3 { background: linear-gradient(135deg, #28a745, #2ecc71); }
    .level-4 { background: linear-gradient(135deg, #fd7e14, #f39c12); }
    .no-role { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }

    /* Connector lines */
    .connector {
      position: absolute;
      background: #3498db;
      opacity: 0.6;
    }

    /* Vertical connectors */
    .vertical-connector {
      width: 2px;
      height: 60px;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Horizontal connectors */
    .horizontal-connector {
      height: 2px;
      width: 60px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Left horizontal connector */
    .connector-left {
      right: 100%;
    }

    /* Right horizontal connector */
    .connector-right {
      left: 100%;
    }

    /* Center connector for multiple children */
    .parent-connector {
      position: absolute;
      width: 80%;
      height: 2px;
      background: #3498db;
      top: 50%;
      left: 10%;
      opacity: 0.6;
      z-index: 0;
    }

    /* Children container */
    .children-container {
      position: relative;
      margin-top: 60px;
    }

    /* For single root */
    .root-container {
      position: relative;
    }

    /* Responsive design */
    @media (max-width: 1200px) {
      .tree-level {
        gap: 40px;
      }
      .node-card {
        min-width: 220px;
      }
    }

    @media (max-width: 768px) {
      .tree-level {
        flex-direction: column;
        align-items: center;
        gap: 60px;
      }
      .node {
        width: 100%;
        max-width: 300px;
      }
      .horizontal-connector {
        display: none;
      }
    }

    /* Animation for nodes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .node-card {
      animation: fadeInUp 0.5s ease forwards;
    }

    /* Stagger animation for children */
    .tree-level .node:nth-child(1) .node-card { animation-delay: 0.1s; }
    .tree-level .node:nth-child(2) .node-card { animation-delay: 0.2s; }
    .tree-level .node:nth-child(3) .node-card { animation-delay: 0.3s; }
    .tree-level .node:nth-child(4) .node-card { animation-delay: 0.4s; }
    .tree-level .node:nth-child(5) .node-card { animation-delay: 0.5s; }
  </style>

/**
 * Create a single node element
 */
function createNodeElement(user, level = 0) {
  const node = document.createElement('div');
  node.className = 'node';
  
  const roleLevel = user.role?.roleLevel || 'no-role';
  const roleName = user.role?.name || 'No Role';
  
  node.innerHTML = `
    <div class="node-card level-${roleLevel}">
      <div class="node-name">${user.fullName}</div>
      <div class="node-email">${user.email}</div>
      <div class="node-role ${roleLevel === 'no-role' ? 'no-role' : `level-${roleLevel}`}">
        ${roleName}
      </div>
    </div>
  `;
  
  return node;
}

/**
 * Render a level of the tree
 */
function renderTreeLevel(users, level = 0, parentNode = null) {
  const levelDiv = document.createElement('div');
  levelDiv.className = `tree-level level-${level}`;
  
  users.forEach((user, index) => {
    const nodeElement = createNodeElement(user, level);
    levelDiv.appendChild(nodeElement);
    
    // Add vertical connector from parent
    if (parentNode && level > 0) {
      const verticalConnector = document.createElement('div');
      verticalConnector.className = 'connector vertical-connector';
      levelDiv.appendChild(verticalConnector);
    }
    
    // Add horizontal connectors between siblings if there are multiple
    if (users.length > 1 && index < users.length - 1) {
      const horizontalConnector = document.createElement('div');
      horizontalConnector.className = 'connector horizontal-connector connector-right';
      levelDiv.appendChild(horizontalConnector);
    }
    
    // Recursively render children
    if (user.children && user.children.length > 0) {
      const childrenContainer = document.createElement('div');
      childrenContainer.className = 'children-container';
      
      // Add vertical connector to children
      const childConnector = document.createElement('div');
      childConnector.className = 'connector vertical-connector';
      childrenContainer.appendChild(childConnector);
      
      // Render child level
      const childLevel = renderTreeLevel(user.children, level + 1, nodeElement);
      childrenContainer.appendChild(childLevel);
      
      // Add connector between multiple children
      if (user.children.length > 1) {
        const parentConnector = document.createElement('div');
        parentConnector.className = 'parent-connector';
        childrenContainer.insertBefore(parentConnector, childLevel);
      }
      
      levelDiv.appendChild(childrenContainer);
    }
  });
  
  return levelDiv;
}

/**
 * Main render function
 */
function renderTree(data) {
  const container = document.getElementById('treeContainer');
  const tree = document.createElement('div');
  tree.className = 'tree';
  
  // Assuming single root for org chart
  if (data.length > 0) {
    const rootContainer = document.createElement('div');
    rootContainer.className = 'root-container';
    
    // Render root
    const rootElement = createNodeElement(data[0], 0);
    rootContainer.appendChild(rootElement);
    
    // Render children if root has them
    if (data[0].children && data[0].children.length > 0) {
      // Add vertical connector
      const verticalConnector = document.createElement('div');
      verticalConnector.className = 'connector vertical-connector';
      rootContainer.appendChild(verticalConnector);
      
      // Add horizontal connector for multiple children
      if (data[0].children.length > 1) {
        const parentConnector = document.createElement('div');
        parentConnector.className = 'parent-connector';
        rootContainer.appendChild(parentConnector);
      }
      
      // Render children levels
      const childrenLevel = renderTreeLevel(data[0].children, 1, rootElement);
      rootContainer.appendChild(childrenLevel);
    }
    
    tree.appendChild(rootContainer);
  }
  
  container.appendChild(tree);
}

  adjustConnectors();
}, 100);
